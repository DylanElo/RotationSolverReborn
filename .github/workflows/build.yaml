name: Build
on:
  pull_request:
    branches:
      - main
jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore NuGet Packages
        run: dotnet restore RotationSolver/RotationSolver.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release RotationSolver/RotationSolver.csproj

      - name: Validate MCH Core Policy
        run: dotnet run --project tests/MCHSyncPolicyCheck/MCHSyncPolicyCheck.csproj -c Release -- .\RotationSolver\bin\Release\RotationSolver.dll

      - name: Validate MCH Sync Policy
        run: dotnet run --project tests/MCHSyncPlusPolicyCheck/MCHSyncPlusPolicyCheck.csproj -c Release -- .\RotationSolver\bin\Release\RotationSolver.dll

      - name: Validate Rotation Configuration Lifecycle
        run: dotnet run --project tests/RotationConfigLifecycleCheck/RotationConfigLifecycleCheck.csproj -c Release
